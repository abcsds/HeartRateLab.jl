name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11']
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # Download and install physionet tools (Compile & Cache Method)
      - name: Set WFDB paths
        id: wfdb_paths
        run: |
          echo "WFDB_SRC_DIR=${{ runner.temp }}/wfdb-10.7.0" >> $GITHUB_OUTPUT
          echo "WFDB_INSTALL_DIR=${{ github.workspace }}/wfdb-install" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache WFDB installation
        id: cache-wfdb
        uses: actions/cache@v5
        with:
          path: ${{ steps.wfdb_paths.outputs.WFDB_INSTALL_DIR }}
          key: ${{ runner.os }}-wfdb-10.7.0-${{ hashFiles('**/Makefile', '**/configure') }} # Cache key includes source config files

      - name: Download and Install WFDB tools (if not cached)
        if: steps.cache-wfdb.outputs.cache-hit != 'true'
        run: |
          WFDB_SRC_DIR=${{ steps.wfdb_paths.outputs.WFDB_SRC_DIR }}
          WFDB_INSTALL_DIR=${{ steps.wfdb_paths.outputs.WFDB_INSTALL_DIR }}
          # Install build dependencies
          sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev wget
          # Download and extract
          wget https://www.physionet.org/physiotools/archives/wfdb-10.7/wfdb-10.7.0.tar.gz -O wfdb.tar.gz
          mkdir -p $WFDB_SRC_DIR
          tar -xvzf wfdb.tar.gz --strip-components=1 -C $WFDB_SRC_DIR
          # Configure, compile, and install locally
          cd $WFDB_SRC_DIR
          ./configure --prefix=$WFDB_INSTALL_DIR
          make install
        shell: bash

      - name: Add WFDB tools to PATH
        run: echo "${{ steps.wfdb_paths.outputs.WFDB_INSTALL_DIR }}/bin" >> $GITHUB_PATH
        shell: bash

      - name: Verify WFDB installation
        run: which ann2rr && echo "WFDB tools installed successfully"
        shell: bash
      # End Download and install physionet tools

      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install xvfb (headless display for GLMakie test deps)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libglu1-mesa
        shell: bash
      - uses: julia-actions/julia-runtest@v1
        with:
          prefix: xvfb-run -s '-screen 0 1024x768x24'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # Serialize docs deploys: a push to main and a tag push both deploy to
    # gh-pages; without this the second push loses the race and fails.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using HeartRateLab
          DocMeta.setdocmeta!(HeartRateLab, :DocTestSetup, :(using HeartRateLab); recursive=true)
          doctest(HeartRateLab)
