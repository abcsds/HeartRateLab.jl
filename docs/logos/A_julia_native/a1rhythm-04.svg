<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Pulse Ring: the rhythm strip bent into a recurring cycle; three beats mark the loop -->
  <circle cx="160" cy="160" r="92" fill="none" stroke="#1A1A1A" stroke-width="4" opacity="0.45"/>
  <g stroke="#1A1A1A" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <line x1="160" y1="60"  x2="160" y2="48"/>
    <line x1="160" y1="260" x2="160" y2="272"/>
    <line x1="60"  y1="160" x2="48"  y2="160"/>
    <line x1="260" y1="160" x2="272" y2="160"/>
    <line x1="93.4" y1="93.4" x2="85" y2="85"/>
    <line x1="226.6" y1="93.4" x2="235" y2="85"/>
    <line x1="93.4" y1="226.6" x2="85" y2="235"/>
    <line x1="226.6" y1="226.6" x2="235" y2="235"/>
  </g>
  <circle cx="160" cy="68"  r="21" fill="#9558B2"/>
  <circle cx="102" cy="216" r="21" fill="#CB3C33"/>
  <circle cx="218" cy="216" r="21" fill="#389826"/>
</svg>
