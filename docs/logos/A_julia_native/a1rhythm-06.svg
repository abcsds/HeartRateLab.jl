    <line x1="50"  y1="262" x2="50"  y2="276"/>
    <line x1="90"  y1="262" x2="90"  y2="276"/>
    <line x1="124" y1="262" x2="124" y2="276"/>
    <line x1="152" y1="262" x2="152" y2="276"/>
    <line x1="175" y1="262" x2="175" y2="276"/>
    <line x1="194" y1="262" x2="194" y2="276"/>
    <line x1="210" y1="262" x2="210" y2="276"/>
