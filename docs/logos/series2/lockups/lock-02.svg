  <line x1="45" y1="150" x2="45" y2="110" stroke="#9558B2" stroke-width="8" stroke-linecap="round"/>
  <circle cx="45" cy="110" r="11" fill="#9558B2"/>
  <line x1="90" y1="150" x2="90" y2="95" stroke="#CB3C33" stroke-width="8" stroke-linecap="round"/>
  <circle cx="90" cy="95" r="12" fill="#CB3C33"/>
  <line x1="150" y1="150" x2="150" y2="120" stroke="#389826" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="120" r="10" fill="#389826"/>
  <text x="200" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="70" textLength="390" lengthAdjust="spacingAndGlyphs" fill="#1A1A1A">HeartRateLab</text>
</svg>
