  <circle cx="45" cy="120" r="20" fill="#9558B2"/>
  <circle cx="100" cy="120" r="20" fill="#CB3C33"/>
  <circle cx="170" cy="120" r="20" fill="#389826"/>
  <line x1="100" y1="150" x2="100" y2="165" stroke="#8A8F98" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="150" x2="170" y2="165" stroke="#8A8F98" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="158" x2="170" y2="158" stroke="#8A8F98" stroke-width="3" stroke-linecap="round"/>
  <text x="225" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="70" textLength="380" lengthAdjust="spacingAndGlyphs" fill="#1A1A1A">HeartRateLab</text>
</svg>
