<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220">
  <!-- "Heart" + "Rate" (weighted, accent color) + "Lab", small tick-comb icon at left -->
  <line x1="15" y1="150" x2="145" y2="150" stroke="#1A1A1A" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="35" y1="150" x2="35" y2="125" stroke="#9558B2" stroke-width="7" stroke-linecap="round"/>
  <circle cx="35" cy="125" r="8" fill="#9558B2"/>
  <line x1="75" y1="150" x2="75" y2="105" stroke="#CB3C33" stroke-width="7" stroke-linecap="round"/>
  <circle cx="75" cy="105" r="9" fill="#CB3C33"/>
  <line x1="125" y1="150" x2="125" y2="130" stroke="#389826" stroke-width="7" stroke-linecap="round"/>
  <circle cx="125" cy="130" r="7" fill="#389826"/>
  <text x="170" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="70" textLength="162" lengthAdjust="spacingAndGlyphs" fill="#1A1A1A">Heart</text>
  <text x="332" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="82" textLength="152" lengthAdjust="spacingAndGlyphs" fill="#CB3C33">Rate</text>
  <text x="484" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="70" textLength="97" lengthAdjust="spacingAndGlyphs" fill="#1A1A1A">Lab</text>
</svg>
