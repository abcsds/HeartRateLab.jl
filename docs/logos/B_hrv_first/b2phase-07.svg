<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Diagonal Trio: Julia's three colors placed on the Poincaré identity line, not the classic triangle -->
  <g transform="rotate(-45 160 160)">
    <line x1="60" y1="160" x2="260" y2="160" stroke="#1A1A1A" stroke-width="2"
          stroke-dasharray="2 12" stroke-linecap="round" opacity="0.3"/>
    <line x1="60" y1="146" x2="60" y2="174" stroke="#1A1A1A" stroke-width="3" opacity="0.3"/>
    <line x1="260" y1="146" x2="260" y2="174" stroke="#1A1A1A" stroke-width="3" opacity="0.3"/>
    <circle cx="108" cy="160" r="21" fill="#9558B2"/>
    <circle cx="160" cy="160" r="21" fill="#CB3C33"/>
    <circle cx="212" cy="160" r="21" fill="#389826"/>
  </g>
</svg>
