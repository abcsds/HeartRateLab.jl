<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Nested Cycles: a loose big orbit (high HRV) versus a tight small orbit (low HRV), same phase frame -->
  <ellipse cx="160" cy="160" rx="105" ry="80" fill="none" stroke="#389826" stroke-width="12"/>
  <ellipse cx="160" cy="160" rx="42"  ry="30" fill="none" stroke="#CB3C33" stroke-width="12"/>
  <circle cx="160" cy="80"  r="9" fill="#2A7A1E"/>
  <circle cx="160" cy="130" r="7" fill="#A62F27"/>
</svg>
