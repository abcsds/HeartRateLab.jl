<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Attractor Butterfly: Lorenz-style double loop, the two wing centers plus the crossing node are the triad -->
  <path d="M160,160 C120,110 60,110 60,160 C60,210 120,210 160,160 C200,110 260,110 260,160 C260,210 200,210 160,160"
        fill="none" stroke="#1A1A1A" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="60" cy="160" r="25" fill="#CB3C33"/>
  <circle cx="260" cy="160" r="25" fill="#389826"/>
  <circle cx="160" cy="160" r="24" fill="#9558B2"/>
</svg>
