  <rect x="92" y="176" width="24" height="94" rx="10" fill="#CB3C33"/>
  <rect x="148" y="120" width="24" height="150" rx="10" fill="#9558B2"/>
  <rect x="204" y="160" width="24" height="110" rx="10" fill="#389826"/>
  <path d="M104,176 L160,120 L216,160" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="104" cy="176" r="24" fill="#CB3C33"/>
  <circle cx="160" cy="120" r="25" fill="#9558B2"/>
  <circle cx="216" cy="160" r="24" fill="#389826"/>
