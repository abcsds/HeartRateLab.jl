<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220">
  <!-- Poincare Cloud lockup: a diagonal scatter of dots inside a ring stands
       for the NN(n) vs NN(n+1) ellipse cloud; a small purple dot floats above
       the wordmark's Heart/Rate seam like a Poincare-dot tittle. -->
  <circle cx="110" cy="110" r="85" fill="none" stroke="#1A1A1A" stroke-width="5"/>
  <circle cx="58" cy="150" r="10" fill="#9558B2"/>
  <circle cx="72" cy="136" r="8" fill="#389826"/>
  <circle cx="86" cy="122" r="11" fill="#CB3C33"/>
  <circle cx="100" cy="108" r="9" fill="#4063D8"/>
  <circle cx="114" cy="94" r="10" fill="#9558B2"/>
  <circle cx="128" cy="80" r="8" fill="#389826"/>
  <circle cx="66" cy="120" r="6" fill="#CB3C33" opacity="0.85"/>
  <circle cx="120" cy="108" r="6" fill="#389826" opacity="0.85"/>
  <text x="220" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="70" textLength="390" lengthAdjust="spacingAndGlyphs"
        fill="#1A1A1A">HeartRateLab</text>
  <circle cx="365" cy="76" r="9" fill="#9558B2"/>
</svg>
