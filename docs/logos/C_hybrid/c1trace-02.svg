<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Poincare Triad: the ellipse's three densest clusters ARE the three Julia dots -->
  <g transform="rotate(-40 160 160)">
    <ellipse cx="160" cy="160" rx="118" ry="46" fill="#9558B2" opacity="0.13"/>
    <line x1="42" y1="160" x2="278" y2="160" stroke="#9558B2" stroke-width="3" stroke-dasharray="2 10" opacity="0.55"/>
    <!-- faint scatter members around each cluster -->
    <circle cx="100" cy="160" r="6" fill="#CB3C33" opacity="0.45"/>
    <circle cx="112" cy="148" r="5" fill="#CB3C33" opacity="0.4"/>
    <circle cx="90" cy="172" r="5" fill="#CB3C33" opacity="0.4"/>
    <circle cx="160" cy="160" r="6" fill="#9558B2" opacity="0.45"/>
    <circle cx="172" cy="149" r="5" fill="#9558B2" opacity="0.4"/>
    <circle cx="148" cy="172" r="5" fill="#9558B2" opacity="0.4"/>
    <circle cx="220" cy="160" r="6" fill="#389826" opacity="0.45"/>
    <circle cx="232" cy="149" r="5" fill="#389826" opacity="0.4"/>
    <circle cx="208" cy="172" r="5" fill="#389826" opacity="0.4"/>
    <!-- the three dense cluster cores = the triad -->
    <circle cx="100" cy="160" r="24" fill="#CB3C33"/>
    <circle cx="160" cy="160" r="24" fill="#9558B2"/>
    <circle cx="220" cy="160" r="24" fill="#389826"/>
  </g>
</svg>
